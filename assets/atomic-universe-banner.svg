<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Prem Polai — Think, Build, Innovate</title>
  <desc id="desc">A cinematic deep-space technology banner with a neural AI profile, glowing atomic nucleus, electron orbits, circuitry, and blue-cyan-purple energy trails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070D"/><stop offset=".55" stop-color="#081326"/><stop offset="1" stop-color="#090817"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#007BFF" stop-opacity=".25"/><stop offset="1" stop-color="#05070D" stop-opacity="0"/></radialGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#007BFF"/><stop offset=".52" stop-color="#00E5FF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
    <linearGradient id="text" x1="0" x2="1"><stop stop-color="#FFFFFF"/><stop offset=".65" stop-color="#C8F6FF"/><stop offset="1" stop-color="#8AD7FF"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#1685D5" stroke-opacity=".09" stroke-width="1"/><circle cx="0" cy="0" r="1.5" fill="#00E5FF" fill-opacity=".18"/></pattern>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)" opacity=".8"/>
  <ellipse cx="825" cy="264" rx="760" ry="360" fill="url(#halo)"/>
  <path d="M0 400 C270 340 350 478 610 411 S1010 351 1240 412 1480 465 1600 374" fill="none" stroke="url(#blue)" stroke-opacity=".28" stroke-width="2"/>
  <path d="M0 426 C250 366 430 492 680 430 S1090 380 1300 432 1510 472 1600 409" fill="none" stroke="#00E5FF" stroke-opacity=".17" stroke-width="1"/>
  <!-- neural AI profile -->
  <g transform="translate(205 240)" filter="url(#glow)">
    <path d="M5 4c-42-49-34-119 25-147 47-22 98 0 115 39 28 8 42 39 30 65 18 29 6 65-19 78-14 40-48 59-91 46l-31 31v-39C10 64-7 37 5 4Z" fill="#07182A" stroke="#19BDF1" stroke-opacity=".76" stroke-width="2.5"/>
    <path d="M43-106c30-19 67-8 77 17 20 4 28 24 20 40 14 18 7 39-12 48-4 26-28 43-52 36M39-76c-19 8-24 28-14 43-12 19-4 38 14 44m43-119c-8 18-3 32 12 41m-48 7 32-14 23 19-8 29 23 18m-67-58 20 30-7 31" fill="none" stroke="#00E5FF" stroke-opacity=".82" stroke-width="2"/>
    <g fill="#8A5CFF"><circle cx="45" cy="-76" r="4"/><circle cx="78" cy="-90" r="4"/><circle cx="112" cy="-48" r="4"/><circle cx="71" cy="-15" r="4"/><circle cx="120" cy="18" r="4"/><circle cx="38" cy="11" r="4"/></g>
    <g fill="#9CEFFF"><circle cx="59" cy="-46" r="3"/><circle cx="97" cy="-19" r="3"/><circle cx="38" cy="11" r="3"/><circle cx="106" cy="-79" r="3"/></g>
  </g>
  <g fill="none" stroke="#00AFFF" stroke-opacity=".35" stroke-width="1.5">
    <path d="M108 119h49l18 18h28M100 358h57l22-22h35M301 110h46l18 18h28M312 370h37l23-18h24"/>
    <path d="M111 138h32m-48 202h28m161-216h43m-22 224h32" stroke="#8A5CFF"/>
  </g>
  <!-- central wordmark -->
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="805" y="222" fill="#00E5FF" opacity=".35" font-size="76" font-weight="700" letter-spacing="9" filter="url(#soft)">PREM POLAI</text>
    <text x="805" y="222" fill="url(#text)" font-size="76" font-weight="700" letter-spacing="9">PREM POLAI</text>
    <path d="M595 250h420" stroke="url(#blue)" stroke-width="2"/>
    <circle cx="595" cy="250" r="3" fill="#00E5FF"/><circle cx="1015" cy="250" r="3" fill="#8A5CFF"/>
    <text x="805" y="296" fill="#AAB7C4" font-size="23" letter-spacing="6">THINK  |  BUILD  |  INNOVATE</text>
    <text x="805" y="347" fill="#64CFFF" fill-opacity=".86" font-size="13" letter-spacing="3">ARTIFICIAL INTELLIGENCE  ·  SOFTWARE  ·  SECURITY</text>
  </g>
  <!-- atomic orbits and glowing nucleus -->
  <g transform="translate(1360 242)" fill="none" stroke="url(#blue)" filter="url(#glow)">
    <ellipse rx="151" ry="61" stroke-width="2" transform="rotate(-28)" stroke-opacity=".9"/>
    <ellipse rx="151" ry="61" stroke-width="1.7" stroke-opacity=".72" transform="rotate(32)"/>
    <ellipse rx="151" ry="61" stroke-width="1.5" stroke-opacity=".65" transform="rotate(88)"/>
    <circle r="31" fill="#071B35" stroke="#00E5FF" stroke-width="2.4"/>
    <circle r="19" fill="#007BFF" fill-opacity=".38" stroke="#92F5FF" stroke-width="1"/>
    <circle cx="-8" cy="-5" r="8" fill="#00E5FF" stroke="none"/><circle cx="9" cy="6" r="7" fill="#8A5CFF" stroke="none"/><circle cx="2" cy="-12" r="6" fill="#FFFFFF" stroke="none"/>
    <circle cx="117" cy="-69" r="7" fill="#00E5FF" stroke="#B6FBFF" stroke-width="1"/>
    <circle cx="-95" cy="72" r="6" fill="#8A5CFF" stroke="#D7C8FF" stroke-width="1"/>
    <circle cx="10" cy="-151" r="6" fill="#00E5FF" stroke="#B6FBFF" stroke-width="1"/>
  </g>
  <!-- floating particles -->
  <g fill="#A7F2FF">
    <circle cx="470" cy="107" r="2"/><circle cx="518" cy="390" r="3" opacity=".7"/><circle cx="1080" cy="129" r="2" opacity=".8"/><circle cx="1142" cy="353" r="2.5"/><circle cx="1260" cy="101" r="2"/><circle cx="1501" cy="348" r="2"/><circle cx="395" cy="302" r="1.8"/><circle cx="1040" cy="385" r="1.8"/>
