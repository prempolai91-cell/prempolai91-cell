  <g fill="#8A5CFF"><circle cx="451" cy="170" r="2"/><circle cx="1114" cy="203" r="2"/><circle cx="1222" cy="304" r="2.5"/><circle cx="497" cy="335" r="1.7"/></g>
  <path d="M0 500H1600" stroke="url(#blue)" stroke-opacity=".55"/>
</svg>
